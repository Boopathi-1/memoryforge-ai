<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoryForge AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #0a0c10;
    --surface:   #111318;
    --surface2:  #191c24;
    --border:    #232733;
    --accent:    #00d4ff;
    --accent2:   #7c5cfc;
    --green:     #00e5a0;
    --yellow:    #ffd166;
    --red:       #ff5c7c;
    --text:      #e4e8f0;
    --muted:     #5a6070;
    --mono:      'Space Mono', monospace;
    --sans:      'DM Sans', sans-serif;
    --radius:    10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%     { opacity:.6; transform:scale(1.3); }
  }
  .logo h1 {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  .session-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 420px;
  }
  .session-bar label { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
  .session-bar input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 10px;
    outline: none;
  }
  .session-bar input:focus { border-color: var(--accent); }

  .hdr-actions { display: flex; gap: 8px; align-items: center; }
  .btn-sm {
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .2s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); }

  .debug-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .toggle-pill {
    width: 36px; height: 20px;
    background: var(--border);
    border-radius: 10px;
    position: relative;
    transition: background .2s;
  }
  .toggle-pill::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    background: var(--muted);
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: all .2s;
  }
  .debug-toggle.on .toggle-pill { background: var(--accent2); }
  .debug-toggle.on .toggle-pill::after { left: 19px; background: #fff; }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .chat-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    gap: 12px;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    font-family: var(--mono);
  }
  .msg.user .avatar { background: var(--accent2); color: #fff; }
  .msg.assistant .avatar { background: #0d1f2d; border: 1px solid var(--accent); color: var(--accent); }

  .bubble {
    max-width: 68%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
  }
  .msg.user .bubble {
    background: var(--accent2);
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
    color: var(--text);
  }

  .typing {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 7px; height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce .8s infinite;
  }
  .typing span:nth-child(2) { animation-delay:.15s; }
  .typing span:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce {
    0%,80%,100% { transform:translateY(0); }
    40% { transform:translateY(-6px); }
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: .5;
    pointer-events: none;
  }
  .empty-state .big { font-size: 40px; }
  .empty-state p { font-size: 13px; color: var(--muted); font-family: var(--mono); }

  .input-area {
    padding: 16px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-area textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 12px 14px;
    resize: none;
    min-height: 46px;
    max-height: 140px;
    outline: none;
    line-height: 1.5;
    transition: border-color .2s;
  }
  .input-area textarea:focus { border-color: var(--accent); }
  .input-area textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 46px; height: 46px;
    border-radius: var(--radius);
    background: var(--accent);
    border: none;
    cursor: pointer;
    color: var(--bg);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #33ddff; transform: scale(1.05); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .debug-panel {
    width: 360px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width .3s ease;
  }
  .debug-panel.hidden { width: 0; border-left: none; }

  .debug-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .dtab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
    letter-spacing: .05em;
  }
  .dtab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .debug-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .debug-content::-webkit-scrollbar { width: 3px; }
  .debug-content::-webkit-scrollbar-thumb { background: var(--border); }

  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-card .label { font-size: 9px; color: var(--muted); font-family: var(--mono); letter-spacing:.08em; margin-bottom: 4px; }
  .stat-card .value { font-size: 20px; font-family: var(--mono); color: var(--accent); font-weight: 700; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.yellow { color: var(--yellow); }
  .stat-card .value.red { color: var(--red); }

  .flow-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .flow-section h4 { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing:.08em; margin-bottom: 10px; }

  .flow-bars { display: flex; flex-direction: column; gap: 6px; }
  .flow-row { display: flex; align-items: center; gap: 8px; }
  .flow-row label { font-size: 10px; font-family: var(--mono); color: var(--muted); width: 72px; flex-shrink: 0; }
  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .6s ease;
  }
  .bar-fill.short { background: var(--accent); }
  .bar-fill.long { background: var(--accent2); }
  .bar-fill.tokens { background: var(--yellow); }
  .flow-row .cnt { font-size: 10px; font-family: var(--mono); color: var(--muted); min-width: 28px; text-align: right; }

  .summary-block {
    background: var(--surface2);
    border: 1px solid var(--accent2);
    border-radius: 8px;
    padding: 12px;
  }
  .summary-block h4 { font-family: var(--mono); font-size: 10px; color: var(--accent2); letter-spacing:.08em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .summary-block p { font-size: 12px; color: var(--muted); line-height: 1.6; white-space: pre-wrap; }

  .msg-log { display: flex; flex-direction: column; gap: 6px; }
  .log-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11px;
    border-left: 3px solid transparent;
  }
  .log-item.user { border-left-color: var(--accent2); }
  .log-item.assistant { border-left-color: var(--accent); }
  .log-item .log-role { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; }
  .log-item .log-text { color: var(--text); line-height: 1.5; }
  .log-item .turn-badge {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    background: var(--border);
    border-radius: 3px;
    padding: 1px 5px;
  }

  .json-view {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--green);
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .status-bar {
    padding: 6px 14px;
    display: flex;
    gap: 12px;
    align-items: center;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .status-item { font-size: 9px; font-family: var(--mono); color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.err { background: var(--red); }
  .status-dot.warn { background: var(--yellow); }

  .section-title {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .05em;
  }
  .badge.yes { background: rgba(0,229,160,.15); color: var(--green); border: 1px solid rgba(0,229,160,.3); }
  .badge.no { background: rgba(90,96,112,.1); color: var(--muted); border: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <h1>MEMORYFORGE <span>AI</span></h1>
  </div>

  <div class="session-bar">
    <label>SESSION</label>
    <input type="text" id="sessionInput" placeholder="auto-generated on first message..." />
  </div>

  <div class="hdr-actions">
    <button class="btn-sm" onclick="refreshDebug()">Refresh</button>
    <button class="btn-sm danger" onclick="clearMemory()">Clear</button>
    <div class="debug-toggle" id="debugToggle" onclick="toggleDebug()">
      <div class="toggle-pill"></div>
      DEBUG
    </div>
  </div>
</header>

<div class="main">
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="big">◈</div>
        <p>Start the conversation...</p>
      </div>
    </div>
    <div class="input-area">
      <textarea id="msgInput" rows="1" placeholder="Ask MemoryForge AI anything..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
  </div>

  <div class="debug-panel hidden" id="debugPanel">
    <div class="debug-tabs">
      <div class="dtab active" onclick="switchTab('stats')" id="tab-stats">MEMORY</div>
      <div class="dtab" onclick="switchTab('log')" id="tab-log">MSG LOG</div>
      <div class="dtab" onclick="switchTab('json')" id="tab-json">JSON</div>
    </div>

    <div class="debug-content" id="debugContent">
      <p style="font-size:12px;color:var(--muted);font-family:var(--mono);text-align:center;margin-top:40px;">Send a message to populate debug info</p>
    </div>

    <div class="status-bar">
      <div class="status-item">
        <div class="status-dot ok" id="statusDot"></div>
        <span id="statusText">READY</span>
      </div>
      <div class="status-item">BACKEND <span id="backendUrl">same origin /api</span></div>
    </div>
  </div>
</div>

<script>
  const API = `${window.location.origin}/api`;

  let sessionId = null;
  let debugOpen = false;
  let activeTab = 'stats';
  let lastFullState = null;

  function toggleDebug() {
    debugOpen = !debugOpen;
    document.getElementById('debugToggle').classList.toggle('on', debugOpen);
    document.getElementById('debugPanel').classList.toggle('hidden', !debugOpen);
    if (debugOpen && sessionId) refreshDebug();
  }

  function switchTab(tab) {
    activeTab = tab;
    ['stats', 'log', 'json'].forEach((t) => {
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    });
    if (lastFullState) renderDebug(lastFullState);
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = '';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('emptyState')?.remove();

    appendMsg('user', text);
    const typingEl = appendTyping();

    try {
      setStatus('SENDING...', 'warn');
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Request failed');
      }

      typingEl.remove();
      sessionId = data.session_id;
      document.getElementById('sessionInput').value = sessionId;

      appendMsg('assistant', data.reply);
      if (debugOpen) refreshDebug();
      setStatus('OK', 'ok');
    } catch (err) {
      typingEl.remove();
      appendMsg('assistant', `Error: ${err.message}`);
      setStatus('ERROR', 'err');
    }

    document.getElementById('sendBtn').disabled = false;
    document.getElementById('msgInput').focus();
  }

  function appendMsg(role, text) {
    const wrap = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
      <div class="bubble">${escHtml(text)}</div>
    `;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
  }

  function appendTyping() {
    const wrap = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    `;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
  }

  async function clearMemory() {
    if (!sessionId) return;
    if (!confirm('Clear all memory for this session?')) return;

    await fetch(`${API}/clear`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId })
    });

    document.getElementById('messages').innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="big">◈</div><p>Memory cleared. Start fresh...</p>
      </div>`;
    sessionId = null;
    document.getElementById('sessionInput').value = '';
    lastFullState = null;
    if (debugOpen) {
      document.getElementById('debugContent').innerHTML =
        '<p style="font-size:12px;color:var(--muted);font-family:var(--mono);text-align:center;margin-top:40px;">Memory cleared</p>';
    }
    setStatus('CLEARED', 'warn');
  }

  async function refreshDebug() {
    const sid = sessionId || document.getElementById('sessionInput').value.trim();
    if (!sid) return;
    try {
      const res = await fetch(`${API}/memory/${sid}`);
      const data = await res.json();
      lastFullState = data;
      renderDebug(data);
    } catch (e) {
      console.error(e);
    }
  }

  function renderDebug(data) {
    const s = data.memory_stats;
    const content = document.getElementById('debugContent');

    if (activeTab === 'stats') {
      const total = s.total_messages || 0;
      const short = s.short_term_count || 0;
      const arch = s.archived_count || 0;
      const tok = Math.round(s.estimated_tokens || 0);
      const maxTok = 4096;
      const tokPct = Math.min(100, (tok / maxTok) * 100);

      content.innerHTML = `
        <div class="section-title">MEMORY STATS</div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="label">TOTAL MSGS</div>
            <div class="value">${total}</div>
          </div>
          <div class="stat-card">
            <div class="label">SHORT-TERM</div>
            <div class="value">${short}</div>
          </div>
          <div class="stat-card">
            <div class="label">ARCHIVED</div>
            <div class="value yellow">${arch}</div>
          </div>
          <div class="stat-card">
            <div class="label">EST. TOKENS</div>
            <div class="value ${tok > 3000 ? 'red' : tok > 1500 ? 'yellow' : ''}">${tok}</div>
          </div>
        </div>

        <div class="flow-section">
          <h4>CONTEXT COMPOSITION</h4>
          <div class="flow-bars">
            <div class="flow-row">
              <label>Short-term</label>
              <div class="bar-track"><div class="bar-fill short" style="width:${total ? (short / total) * 100 : 0}%"></div></div>
              <span class="cnt">${short}</span>
            </div>
            <div class="flow-row">
              <label>Archived</label>
              <div class="bar-track"><div class="bar-fill long" style="width:${total ? (arch / total) * 100 : 0}%"></div></div>
              <span class="cnt">${arch}</span>
            </div>
            <div class="flow-row">
              <label>Token usage</label>
              <div class="bar-track"><div class="bar-fill tokens" style="width:${tokPct}%"></div></div>
              <span class="cnt">${tok}</span>
            </div>
          </div>
        </div>

        <div class="stat-card" style="grid-column:span 2">
          <div class="label">LONG-TERM SUMMARY ACTIVE</div>
          <div style="margin-top:6px">
            <span class="badge ${s.has_summary ? 'yes' : 'no'}">${s.has_summary ? 'YES' : 'NONE'}</span>
            ${s.has_summary ? `<span style="font-size:10px;color:var(--muted);font-family:var(--mono);margin-left:8px">covers up to turn ${s.summary_covers_turns}</span>` : ''}
          </div>
        </div>

        ${data.summary ? `
        <div class="summary-block">
          <h4>LONG-TERM MEMORY</h4>
          <p>${escHtml(data.summary)}</p>
        </div>` : ''}
      `;
    } else if (activeTab === 'log') {
      const msgs = data.messages || [];
      content.innerHTML = `
        <div class="section-title">MESSAGE HISTORY (${msgs.length})</div>
        <div class="msg-log">
          ${msgs.length === 0 ? '<p style="color:var(--muted);font-size:12px;font-family:var(--mono)">No messages yet</p>' :
            msgs.map((m) => `
              <div class="log-item ${m.role}">
                <div class="log-role">
                  <span>${m.role.toUpperCase()}</span>
                  <span class="turn-badge">T${m.turn ?? ''}</span>
                </div>
                <div class="log-text">${escHtml(m.content.slice(0, 200))}${m.content.length > 200 ? '...' : ''}</div>
              </div>
            `).join('')}
        </div>
      `;
    } else if (activeTab === 'json') {
      content.innerHTML = `
        <div class="section-title">RAW STATE</div>
        <div class="json-view">${escHtml(JSON.stringify(data, null, 2))}</div>
      `;
    }
  }

  function setStatus(text, type) {
    document.getElementById('statusText').textContent = text;
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot ' + type;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  document.getElementById('sessionInput').addEventListener('change', (e) => {
    sessionId = e.target.value.trim() || null;
  });
</script>
</body>
</html>
